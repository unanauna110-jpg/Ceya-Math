<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ceya Math</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
    background: #ffdcec;
}

.game {
    width: 85%;
    max-width: 400px;
    padding: 30px;
    text-align: center;
    background: white;
    border-radius: 25px;
}

h1 {
    color: #d64f82;
}

button {
    border: none;
    border-radius: 20px;
    padding: 15px 35px;
    margin: 10px;
    font-size: 20px;
    background: #d64f82;
    color: white;
    cursor: pointer;
}

.answer {
    background: #f3c3d7;
    color: #333;
    width: 40%;
}

#game {
    display: none;
}

#answers {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}
</style>
</head>

<body>

<div class="game">

    <div id="home">

        <h1>🧮 Ceya Math 💗</h1>

        <p>Siap bermain matematika?</p>

        <button id="start">
            START 🎮
        </button>

    </div>


    <div id="game">

        <h1>🧮 Ceya Math</h1>

        <p>⭐ Score: <span id="score">0</span></p>

        <h2 id="question">
            Soal
        </h2>

        <div id="answers"></div>

        <p id="message"></p>

    </div>

</div>


<script>

var score = 0;
var answer = 0;

var start = document.getElementById("start");

start.onclick = function () {

    document.getElementById("home").style.display = "none";

    document.getElementById("game").style.display = "block";

    newQuestion();

};


function newQuestion() {

    var a = Math.floor(Math.random() * 10) + 1;

    var b = Math.floor(Math.random() * 10) + 1;

    answer = a + b;

    document.getElementById("question").innerHTML =
        a + " + " + b + " = ?";

    document.getElementById("answers").innerHTML = "";

    document.getElementById("message").innerHTML = "";

    var choices = [
        answer,
        answer + 1,
        answer + 3,
        answer - 2
    ];

    choices.sort(function () {
        return Math.random() - 0.5;
    });


    for (var i = 0; i < choices.length; i++) {

        var button = document.createElement("button");

        button.className = "answer";

        button.innerHTML = choices[i];

        button.onclick = function () {

            if (Number(this.innerHTML) === answer) {

                score += 10;

                document.getElementById("score").innerHTML =
                    score;

                document.getElementById("message").innerHTML =
                    "✨ BENAR!";

                setTimeout(newQuestion, 600);

            } else {

                document.getElementById("message").innerHTML =
                    "❌ Salah! Coba lagi.";

            }

        };

        document.getElementById("answers")
            .appendChild(button);
    }
}

</script>

</body>
</html>
