<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ceya Math</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at 10% 10%, #fff4fa 0%, transparent 35%),
        radial-gradient(circle at 90% 90%, #eee4ff 0%, transparent 40%),
        linear-gradient(135deg, #ffddea, #eee4ff);

    display: flex;
    justify-content: center;
    align-items: center;

    color: #4c3848;
}

/* =========================
   FLOATING BACKGROUND
========================= */

#floating {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.float {
    position: absolute;
    bottom: -60px;
    opacity: 0;

    animation: floatUp linear forwards;

    user-select: none;
}

@keyframes floatUp {
    0% {
        transform:
            translateY(0)
            rotate(0deg);

        opacity: 0;
    }

    10% {
        opacity: .7;
    }

    90% {
        opacity: .5;
    }

    100% {
        transform:
            translateY(-115vh)
            rotate(25deg);

        opacity: 0;
    }
}

/* =========================
   CONTAINER
========================= */

.container {
    position: relative;
    z-index: 2;

    width: 92%;
    max-width: 450px;
    max-height: 95vh;

    overflow-y: auto;

    padding: 25px;

    background: rgba(255,255,255,.9);

    backdrop-filter: blur(12px);

    border-radius: 30px;

    border: 2px solid rgba(255,255,255,.8);

    box-shadow:
        0 20px 60px
        rgba(100,60,100,.2);

    text-align: center;
}

/* =========================
   SCREEN
========================= */

#gameScreen,
#resultScreen {
    display: none;
}

/* =========================
   HOME
========================= */

.logo {
    font-size: 38px;
    font-weight: 900;

    color: #d34f82;

    text-shadow:
        2px 2px 0 #ffe1ed;
}

.subtitle {
    margin-top: 5px;

    color: #987c91;

    font-size: 14px;
}

.decor {
    margin: 25px 0;

    font-size: 29px;

    letter-spacing: 8px;

    animation: wiggle 2s infinite;
}

@keyframes wiggle {
    0%,100% {
        transform: rotate(0deg);
    }

    50% {
        transform: rotate(3deg);
    }
}

.description {
    background: #fff3f8;

    border-radius: 20px;

    padding: 16px;

    line-height: 1.6;

    font-size: 14px;
}

.startButton {
    width: 100%;

    margin-top: 20px;

    border: none;

    border-radius: 25px;

    padding: 16px;

    background:
        linear-gradient(
            135deg,
            #d84f82,
            #a05ac9
        );

    color: white;

    font-size: 19px;

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 8px 20px
        rgba(160,70,130,.25);

    transition: .2s;
}

.startButton:hover {
    transform: translateY(-2px);
}

.startButton:active {
    transform: scale(.96);
}

/* =========================
   GAME HEADER
========================= */

.top {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 12px;
}

.smallTitle {
    color: #d34f82;

    font-weight: 900;

    font-size: 20px;
}

.counter {
    color: #8d7285;

    font-size: 13px;
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;

    grid-template-columns:
        1fr 1fr 1
