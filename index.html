<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ceya Math</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ffdcec,#e7dcff);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    color:#403442;
    overflow:hidden;
}

/* =========================
   LOVE & RUMUS TERBANG
========================= */

#floating{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.float{
    position:absolute;
    bottom:-50px;
    opacity:0;
    font-weight:bold;
    animation:flyUp linear forwards;
}

@keyframes flyUp{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }

    10%{
        opacity:.7;
    }

    90%{
        opacity:.5;
    }

    100%{
        transform:translateY(-115vh) rotate(25deg);
        opacity:0;
    }
}

/* =========================
   CONTAINER
========================= */

.container{
    position:relative;
    z-index:2;

    width:100%;
    max-width:430px;

    max-height:95vh;
    overflow-y:auto;

    background:rgba(255,255,255,.94);
    border-radius:28px;
    padding:25px;

    box-shadow:
        0 15px 40px
        rgba(90,60,100,.2);

    text-align:center;
}

#gameScreen,
#resultScreen{
    display:none;
}

/* =========================
   HOME
========================= */

.logo{
    font-size:34px;
    font-weight:900;
    color:#d34f82;
    margin-bottom:5px;
}

.subtitle{
    color:#8b7184;
    margin-bottom:25px;
}

.homeDecor{
    font-size:28px;
    letter-spacing:8px;
    margin:20px 0;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-6px);
    }
}

.homeText{
    background:#fff3f8;
    border-radius:20px;
    padding:15px;
    line-height:1.6;
}

.startButton{
    border:none;
    padding:15px 40px;
    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            #d45183,
            #9655c9
        );

    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;

    box-shadow:
        0 7px 18px
        rgba(150,70,130,.3);

    transition:.15s;
}

.startButton:hover{
    transform:translateY(-2px);
}

.startButton:active{
    transform:scale(.95);
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-bottom:15px;
}

.stat{
    background:#fff0f6;
    border-radius:15px;
    padding:10px;
    font-size:13px;
    font-weight:bold;
}

.stat span{
    display:block;
    font-size:20px;
    margin-top:4px;
}

/* =========================
   LEVEL
========================= */

.level{
    background:#f0e5ff;
    color:#76509c;
    border-radius:15px;
    padding:10px;
    font-weight:bold;
    margin-bottom:12px;
}
