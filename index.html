<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ceya Math</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ffdcec,#e7dcff);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    color:#403442;
}

.container{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:28px;
    padding:25px;
    box-shadow:0 15px 40px rgba(90,60,100,.2);
    text-align:center;
}

#gameScreen,#resultScreen{
    display:none;
}

.logo{
    font-size:34px;
    font-weight:900;
    color:#d34f82;
    margin-bottom:5px;
}

.subtitle{
    color:#8b7184;
    margin-bottom:25px;
}

.startButton{
    border:none;
    padding:15px 40px;
    border-radius:30px;
    background:linear-gradient(135deg,#d45183,#9655c9);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 7px 18px rgba(150,70,130,.3);
}

.startButton:active{
    transform:scale(.95);
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-bottom:15px;
}

.stat{
    background:#fff0f6;
    border-radius:15px;
    padding:10px;
    font-size:13px;
    font-weight:bold;
}

.stat span{
    display:block;
    font-size:20px;
    margin-top:4px;
}

.level{
    background:#f0e5ff;
    color:#76509c;
    border-radius:15px;
    padding:10px;
    font-weight:bold;
    margin-bottom:12px;
}

.progressBackground{
    width:100%;
    height:9px;
    background:#eee0e9;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:15px;
}

.progress{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#dd5688,#9c59cb);
    transition:.3s;
}

.timer{
    font-size:25px;
    font-weight:bold;
    color:#d44776;
    margin-bottom:10px;
}

.question{
    background:#fff5f8;
    border:3px solid #efc1d2;
    border-radius:20px;
    padding:25px 10px;
    font-size:34px;
    font-weight:900;
    margin-bottom:18px;
}

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.answer{
    border:none;
    border-radius:16px;
    padding:16px;
    background:#f6c9dc;
    color:#4a3642;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

.answer:active{
    transform:scale(.95);
}

.answer.correct{
    background:#9be2ac;
}

.answer.wrong{
    background:#f39a9a;
}

.message{
    min-height:25px;
    margin-top:18px;
    font-weight:bold;
}

.resultIcon{
    font-size:70px;
}

.resultTitle{
    color:#d34f82;
    font-size:32px;
}

.finalScore{
    font-size:42px;
    font-weight:900;
    color:#d34f82;
    margin:10px;
}

.difficulty{
    display:inline-block;
    padding:6px 14px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    margin-bottom:8px;
    background:#eee1ff;
    color:#76509c;
}

@media(max-width:380px){
    .container{padding:20px}
    .question{font-size:28px}
    .answer{font-size:18px}
}
</style>
</head>

<body>

<div class="container">

<!-- HOME -->
<div id="homeScreen">

    <div class="logo">🧮 Ceya Math</div>

    <div class="subtitle">
        Math Challenge
    </div>

    <p>
        Tantang kemampuan matematikamu!
    </p>

    <p>
        <b>15 soal</b> •
        <b>15 detik setiap soal</b>
    </p>

    <p>
        🟢 SD → 🔵 SMP → 🔴 SMA
    </p>

    <br>

    <button class="startButton" id="startButton">
        START 🎮
    </button>

</div>


<!-- GAME -->
<div id="gameScreen">

    <div class="logo">
        🧮 Ceya Math
    </div>

    <div class="stats">

        <div class="stat">
            ⭐ SCORE
            <span id="score">0</span>
        </div>

        <div class="stat">
            ❤️ LIVES
            <span id="lives">❤️❤️❤️</span>
        </div>

        <div class="stat">
            🔥 COMBO
            <span id="combo">0</span>
        </div>

    </div>

    <div class="level">

        <span id="difficulty" class="difficulty">
            SD
        </span>

        <br>

        SOAL
        <span id="questionNumber">1</span>
        / 15

    </div>

    <div class="progressBackground">
        <div class="progress" id="progress"></div>
    </div>

    <div class="timer">
        ⏱️ <span id="timer">15</span>
        detik
    </div>

    <div class="question" id="question">
        1 + 1 = ?
    </div>

    <div class="answers" id="answers"></div>

    <div class="message" id="message"></div>

</div>


<!-- RESULT -->
<div id="resultScreen">

    <div class="resultIcon" id="resultIcon">
        🏆
    </div>

    <h1 class="resultTitle" id="resultTitle">
        YOU WIN!
    </h1>

    <p>
        Skor akhir kamu:
    </p>

    <div class="finalScore">
        ⭐ <span id="finalScore">0</span>
    </div>

    <p>
        Jawaban benar:
        <b id="correctCount">0</b> / 15
    </p>

    <p>
        Combo terbaik:
        🔥 <b id="bestCombo">0</b>
    </p>

    <br>

    <button class="startButton" id="restartButton">
        MAIN LAGI 🔄
    </button>

</div>

</div>


<script>

let score=0;
let lives=3;
let combo=0;
let bestCombo=0;
let correctCount=0;
let questionNumber=0;
let correctAnswer=0;
let time=15;
let timer=null;
let locked=false;


/* =========================
   BANK SOAL
========================= */

const questions=[

/* ===== SD ===== */

{
    level:"SD",
    question:"25 + 37 = ?",
    answer:62,
    choices:[52,62,72,82]
},

{
    level:"SD",
    question:"8 × 7 = ?",
    answer:56,
    choices:[48,54,56,64]
},

{
    level:"SD",
    question:"144 ÷ 12 = ?",
    answer:12,
    choices:[10,11,12,14]
},

{
    level:"SD",
    question:"3/4 dari 20 = ?",
    answer:15,
    choices:[10,12,15,18]
},

{
    level:"SD",
    question:"Keliling persegi sisi 9 cm = ?",
    answer:36,
    choices:[18,27,36,45]
},


/* ===== SMP ===== */

{
    level:"SMP",
    question:"2x + 6 = 16. Nilai x = ?",
    answer:5,
    choices:[3,4,5,6]
},

{
    level:"SMP",
    question:"√144 + 5 = ?",
    answer:17,
    choices:[15,16,17,18]
},

{
    level:"SMP",
    question:"Jika a = 4, maka 2a² = ?",
    answer:32,
    choices:[16,24,32,36]
},

{
    level:"SMP",
    question:"Luas lingkaran r = 7 cm (π = 22/7) = ?",
    answer:154,
    choices:[144,154,164,174]
},

{
    level:"SMP",
    question:"3x - 7 = 14. Nilai x = ?",
    answer:7,
    choices:[5,6,7,8]
},


/* ===== SMA ===== */

{
    level:"SMA",
    question:"x² - 5x + 6 = 0. Akar-akarnya adalah?",
    answer:"2 dan 3",
    choices:["1 dan 6","2 dan 3","3 dan 4","1 dan 5"]
},

{
    level:"SMA",
    question:"Turunan f(x) = x² adalah?",
    answer:"2x",
    choices:["x","2x","x²","2"]
},

{
    level:"SMA",
    question:"Jika log₂ 8 = x, maka x = ?",
    answer:3,
    choices:[2,3,4,8]
},

{
    level:"SMA",
    question:"lim x→2 (x² + 3) = ?",
    answer:7,
    choices:[5,6,7,8]
},

{
    level:"SMA",
    question:"Jika sin 30° = ?",
    answer:"1/2",
    choices:["1/4","1/2","√2/2","√3/2"]
}

];


/* =========================
   ELEMENT
========================= */

const startButton=
document.getElementById("startButton");

const restartButton=
document.getElementById("restartButton");


startButton.onclick=startGame;

restartButton.onclick=startGame;


/* =========================
   START GAME
========================= */

function startGame(){

    score=0;
    lives=3;
    combo=0;
    bestCombo=0;
    correctCount=0;
    questionNumber=0;
    locked=false;

    clearInterval(timer);

    document.getElementById("homeScreen")
    .style.display="none";

    document.getElementById("resultScreen")
    .style.display="none";

    document.getElementById("gameScreen")
    .style.display="block";

    updateStats();

    nextQuestion();
}


/* =========================
   UPDATE
========================= */

function updateStats(){

    document.getElementById("score")
    .textContent=score;

    document.getElementById("lives")
    .textContent=
        "❤️".repeat(lives)+
        "🖤".repeat(3-lives);

    document.getElementById("combo")
    .textContent=combo;

    document.getElementById("questionNumber")
    .textContent=questionNumber;

    document.getElementById("progress")
    .style.width=
        (questionNumber/15*100)+"%";
}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion(){

    clearInterval(timer);

    locked=false;

    if(questionNumber>=15){

        winGame();

        return;
    }

    questionNumber++;

    const current=
        questions[questionNumber-1];

    document.getElementById("difficulty")
    .textContent=current.level;

    document.getElementById("question")
    .textContent=current.question;

    correctAnswer=current.answer;

    createAnswers(current.choices);

    updateStats();

    startTimer();
}


/* =========================
   ANSWERS
========================= */

function createAnswers(choices){

    const box=
        document.getElementById("answers");

    box.innerHTML="";

    let shuffled=
        [...choices].sort(
            ()=>Math.random()-.5
        );

    shuffled.forEach(choice=>{

        const button=
            document.createElement("button");

        button.className="answer";

        button.textContent=choice;

        button.onclick=function(){

            checkAnswer(
                choice,
                button
            );

        };

        box.appendChild(button);
    });
}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(
    choice,
    button
){

    if(locked)return;

    locked=true;

    clearInterval(timer);

    document
    .querySelectorAll(".answer")
    .forEach(btn=>{
        btn.disabled=true;
    });


    if(
        String(choice) ===
        String(correctAnswer)
    ){

        button.classList.add("correct");

        correctCount++;

        combo++;

        if(combo>bestCombo){
            bestCombo=combo;
        }

        let points=
            10+(combo*5);

        score+=points;

        document.getElementById("message")
        .textContent=
            "✨ BENAR! +"+points+" ⭐";

        updateStats();

        setTimeout(
            nextQuestion,
            700
        );

    }

    else{

        button.classList.add("wrong");

        lives--;

        combo=0;

        document.getElementById("message")
        .textContent=
            "❌ Jawaban salah!";

        updateStats();

        if(lives<=0){

            setTimeout(
                gameOver,
                700
            );

        }

        else{

            setTimeout(
                nextQuestion,
                700
            );

        }
    }
}


/* =========================
   TIMER 15 DETIK
========================= */

function startTimer(){

    time=15;

    document.getElementById("timer")
    .textContent=time;

    timer=setInterval(()=>{

        time--;

        document.getElementById("timer")
        .textContent=time;

        if(time<=0){

            clearInterval(timer);

            if(locked)return;

            locked=true;

            lives--;

            combo=0;

            document.getElementById("message")
            .textContent=
                "⏰ WAKTU HABIS!";

            updateStats();

            if(lives<=0){

                setTimeout(
                    gameOver,
                    700
                );

            }

            else{

                setTimeout(
                    nextQuestion,
                    700
                );
            }
        }

    },1000);
}


/* =========================
   WIN
========================= */

function winGame(){

    clearInterval(timer);

    document.getElementById("gameScreen")
    .style.display="none";

    document.getElementById("resultScreen")
    .style.display="block";

    document.getElementById("resultIcon")
    .textContent="🏆";

    document.getElementById("resultTitle")
    .textContent="YOU WIN! 🎉";

    document.getElementById("finalScore")
    .textContent=score;

    document.getElementById("correctCount")
    .textContent=correctCount;

    document.getElementById("bestCombo")
    .textContent=bestCombo;
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    clearInterval(timer);

    document.getElementById("gameScreen")
    .style.display="none";

    document.getElementById("resultScreen")
    .style.display="block";

    document.getElementById("resultIcon")
    .textContent="💀";

    document.getElementById("resultTitle")
    .textContent="GAME OVER";

    document.getElementById("finalScore")
    .textContent=score;

    document.getElementById("correctCount")
    .textContent=correctCount;

    document.getElementById("bestCombo")
    .textContent=bestCombo;
}

</script>

</body>
</html>
